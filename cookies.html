<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />

  <link rel="shortcut icon" type="image/png" href="/balloon-round.png">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050505" id="themeColorMeta">

  <title>Cookies • Pop The Balloon — Center Stage</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- PWA / Mobile Install Support -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/balloon-round1.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTB Center Stage">

  <style>
    body.has-install-bar {
      padding-bottom: 105px;
    }

    .ptb-install-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(18, 18, 18, 0.96);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-family: Arial, sans-serif;
    }

    .ptb-install-bar[hidden] {
      display: none !important;
    }

    .ptb-install-close {
      background: transparent;
      border: 0;
      color: #ccc;
      font-size: 28px;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ptb-install-close:active {
      transform: scale(0.95);
    }

    .ptb-install-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .ptb-install-text {
      flex: 1;
      min-width: 0;
    }

    .ptb-install-text strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ptb-install-text span {
      display: block;
      font-size: 12px;
      color: #bdbdbd;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ptb-install-btn {
      background: #e11d2e;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .ptb-install-btn:active {
      transform: scale(0.97);
    }

    @media (min-width: 768px) {
      .ptb-install-bar {
        max-width: 430px;
        left: 50%;
        right: auto;
        width: calc(100% - 24px);
        transform: translateX(-50%);
      }
    }

    @media (max-width: 390px) {
      .ptb-install-text strong {
        font-size: 14px;
      }

      .ptb-install-text span {
        font-size: 11px;
      }

      .ptb-install-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .ptb-install-icon {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body class="legal">

  <header class="legal__header">
    <img
      id="brandLogo"
      class="brand-img"
      src="logo-dark.png"
      data-dark-logo="logo-dark.png"
      data-light-logo="logo-light.png"
      alt="Pop The Balloon Center Stage logo"
    />

    <nav class="legal__nav" aria-label="Legal links">
      <a href="home.html" class="legal__nav-link">Home</a>
      <a href="index.html" class="legal__nav-link">Terms of Service</a>
      <a href="privacy.html" class="legal__nav-link">Privacy Policy</a>
      <a href="safety.html" class="legal__nav-link">User Safety &amp; Reporting</a>
      <a href="download.html" class="legal__nav-link">Download</a>
      <a href="contact.html" class="legal__nav-link">Contact Us</a>
      <a href="faq.html" class="legal__nav-link">FAQ</a>
      <a href="child-safety.html" class="legal__nav-link">CSAE</a>
    </nav>

    <div class="theme-toggle">
      <button id="themeBtn" class="theme-toggle__btn" type="button">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark</span>
      </button>
    </div>
  </header>

  <main class="legal__main center">
    <section class="pdf">
      <iframe
        class="pdf__frame"
        title="Pop The Balloon Cookies Policy"
        src="https://drive.google.com/file/d/1EbgMCr1gNdT8ePfB5_LtYFoobYJAUo0p/preview"
        allowfullscreen
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>
  </main>

  <footer class="legal__footer">
    <p>© <span id="y"></span> PTB Center Stage</p>
  </footer>

  <!-- Bottom Install Banner -->
  <div id="ptbInstallBar" class="ptb-install-bar" hidden>
    <button id="ptbInstallClose" class="ptb-install-close" type="button" aria-label="Close install banner">×</button>

    <img
      src="/balloon-round1.png"
      alt="PTB app icon"
      class="ptb-install-icon">

    <div class="ptb-install-text">
      <strong>Pop The Balloon</strong>
      <span>Center Stage</span>
    </div>

    <button id="ptbInstallBtn" class="ptb-install-btn" type="button">Install</button>
  </div>

  <script>
    // Footer year
    const yearEl = document.getElementById('y');

    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    // Theme toggle
    const KEY = 'ptb_theme';
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const themeColorMeta = document.getElementById('themeColorMeta');

    const label = () => btn && btn.querySelector('.theme-toggle__label');
    const icon = () => btn && btn.querySelector('.theme-toggle__icon');

    function getStoredTheme() {
      try {
        return localStorage.getItem(KEY);
      } catch (error) {
        return null;
      }
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (error) {
        // Ignore storage errors inside restricted in-app browsers.
      }
    }

    function getSavedTheme() {
      const savedTheme = getStoredTheme();

      // Fix old saved values from previous code.
      // "auto" can make LinkedIn/mobile browsers show the wrong logo.
      if (savedTheme !== 'dark' && savedTheme !== 'light') {
        setStoredTheme('dark');
        return 'dark';
      }

      return savedTheme;
    }

    function updateLogo(mode) {
      const logo = document.getElementById('brandLogo');

      if (!logo) {
        return;
      }

      const darkLogo = logo.dataset.darkLogo || 'logo-dark.png';
      const lightLogo = logo.dataset.lightLogo || 'logo-light.png';

      logo.src = mode === 'dark' ? darkLogo : lightLogo;
    }

    function updateThemeButton(mode) {
      if (label()) {
        label().textContent = mode === 'dark' ? 'Dark' : 'Light';
      }

      if (icon()) {
        icon().textContent = mode === 'dark' ? '🌙' : '☀️';
      }
    }

    function updateThemeColor(mode) {
      if (!themeColorMeta) {
        return;
      }

      themeColorMeta.setAttribute('content', mode === 'dark' ? '#050505' : '#ffffff');
    }

    function applyTheme(mode, withTransition = false) {
      const cleanMode = mode === 'light' ? 'light' : 'dark';

      if (withTransition) {
        root.classList.add('theme-transition');

        requestAnimationFrame(() => {
          root.setAttribute('data-theme', cleanMode);
          updateLogo(cleanMode);
          updateThemeButton(cleanMode);
          updateThemeColor(cleanMode);

          setTimeout(() => {
            root.classList.remove('theme-transition');
          }, 650);
        });

        return;
      }

      root.setAttribute('data-theme', cleanMode);
      updateLogo(cleanMode);
      updateThemeButton(cleanMode);
      updateThemeColor(cleanMode);
    }

    function cycleTheme() {
      const currentTheme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      setStoredTheme(nextTheme);
      applyTheme(nextTheme, true);
    }

    applyTheme(getSavedTheme());

    if (btn) {
      btn.addEventListener('click', cycleTheme);
    }
  </script>

  <script>
    // Bottom install banner
    // Close button hides it, then it shows again after 3 page visits.
    (function () {
      const ANDROID_PACKAGE_ID = "com.experimentprojects.centerstage";
      const ANDROID_APP_URL = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE_ID;
      const IOS_APP_URL = "https://apps.apple.com/app/ptb-center-stage/id6756091119";

      const CLOSE_KEY = "ptbInstallBarClosed";
      const VISIT_KEY = "ptbInstallBarVisitsAfterClose";
      const SHOW_AGAIN_AFTER_VISITS = 3;

      const bar = document.getElementById("ptbInstallBar");
      const closeBtn = document.getElementById("ptbInstallClose");
      const installBtn = document.getElementById("ptbInstallBtn");

      let deferredPrompt = null;

      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(userAgent);

      const isIOS =
        /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      if (isStandalone || !bar || !closeBtn || !installBtn) {
        return;
      }

      let wasClosed = false;

      try {
        wasClosed = localStorage.getItem(CLOSE_KEY) === "true";
      } catch (error) {
        wasClosed = false;
      }

      if (wasClosed) {
        let visits = 0;

        try {
          visits = parseInt(localStorage.getItem(VISIT_KEY) || "0", 10);
        } catch (error) {
          visits = 0;
        }

        visits += 1;

        if (visits >= SHOW_AGAIN_AFTER_VISITS) {
          try {
            localStorage.removeItem(CLOSE_KEY);
            localStorage.removeItem(VISIT_KEY);
          } catch (error) {
            // Ignore storage errors.
          }

          wasClosed = false;
        } else {
          try {
            localStorage.setItem(VISIT_KEY, String(visits));
          } catch (error) {
            // Ignore storage errors.
          }

          return;
        }
      }

      function showInstallBar() {
        bar.hidden = false;
        document.body.classList.add("has-install-bar");
      }

      function hideInstallBar() {
        bar.hidden = true;
        document.body.classList.remove("has-install-bar");
      }

      function closeInstallBar() {
        hideInstallBar();

        try {
          localStorage.setItem(CLOSE_KEY, "true");
          localStorage.setItem(VISIT_KEY, "0");
        } catch (error) {
          // Ignore storage errors.
        }
      }

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferredPrompt = event;
        showInstallBar();
      });

      if (isAndroid || isIOS) {
        showInstallBar();
      }

      closeBtn.addEventListener("click", closeInstallBar);

      installBtn.addEventListener("click", async function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          hideInstallBar();
          return;
        }

        if (isAndroid) {
          window.location.href = ANDROID_APP_URL;
          return;
        }

        if (isIOS) {
          window.location.href = IOS_APP_URL;
        }
      });

      window.addEventListener("appinstalled", hideInstallBar);
    })();
  </script>

</body>
</html>
