<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />

  <link rel="shortcut icon" type="image/png" href="/balloon-round.png">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050505">

  <title>Terms of Service • Pop The Balloon — Center Stage</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- PWA / Mobile Install Support -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/balloon-round.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTB Center Stage">

  <style>
    /* Bottom Install Banner */
    body.has-install-bar {
      padding-bottom: 105px;
    }

    .ptb-install-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(18, 18, 18, 0.96);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-family: Arial, sans-serif;
    }

    .ptb-install-bar[hidden] {
      display: none !important;
    }

    .ptb-install-close {
      background: transparent;
      border: 0;
      color: #ccc;
      font-size: 28px;
      line-height: 1;
      padding: 0 4px;
      cursor: pointer;
    }

    .ptb-install-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .ptb-install-text {
      flex: 1;
      min-width: 0;
    }

    .ptb-install-text strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ptb-install-text span {
      display: block;
      font-size: 12px;
      color: #bdbdbd;
      margin-top: 2px;
      white-space: nowrap;
    }

    .ptb-install-btn {
      background: #e11d2e;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ptb-install-btn:active {
      transform: scale(0.97);
    }

    @media (min-width: 768px) {
      .ptb-install-bar {
        max-width: 430px;
        left: 50%;
        right: auto;
        width: calc(100% - 24px);
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body class="legal">

  <!-- Consent Manager snippet -->
  <div id="ptb-consent-container"></div>
  <script>
    fetch('/consent/consent.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('ptb-consent-container').innerHTML = html;

        const script = document.createElement('script');
        script.src = '/consent/consent.js';
        document.body.appendChild(script);
      })
      .catch(() => {
        console.warn('Consent manager failed to load.');
      });
  </script>
  <!-- End Consent Manager snippet -->

  <header class="legal__header">
    <img id="logo-dark" class="brand-img" src="logo-light.png" alt="Pop The Balloon white logo" style="display:none" />
    <img id="logo-light" class="brand-img" src="logo-dark.png" alt="Pop The Balloon black logo" style="display:none" />

    <nav class="legal__nav" aria-label="Legal links">
      <a href="home.html" class="legal__nav-link">Home</a>
      <a href="index.html" aria-current="page" class="legal__nav-link is-active">Terms of Service</a>
      <a href="privacy.html" class="legal__nav-link">Privacy Policy</a>
      <a href="safety.html" class="legal__nav-link">User Safety &amp; Reporting</a>
      <a href="download.html" class="legal__nav-link">Download</a>
      <a href="contact.html" class="legal__nav-link">Contact Us</a>
      <a href="faq.html" class="legal__nav-link">FAQ</a>
      <a href="child-safety.html" class="legal__nav-link">CSAE</a>
    </nav>

    <div class="theme-toggle">
      <button id="themeBtn" class="theme-toggle__btn" type="button">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark</span>
      </button>
    </div>
  </header>

  <main class="legal__main center">
    <section class="pdf">
      <iframe
        class="pdf__frame"
        title="Terms of Service"
        src="https://drive.google.com/file/d/1fa15tNvDvoq2NlK9nRsh5PYyoRR5oGE-/preview"
        allowfullscreen
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>
  </main>

  <footer class="legal__footer">
    <p>© <span id="y"></span> PTB Center Stage</p>
  </footer>

  <!-- Bottom Install Banner -->
  <div id="ptbInstallBar" class="ptb-install-bar" hidden>
    <button id="ptbInstallClose" class="ptb-install-close" type="button" aria-label="Close install banner">×</button>

    <img
      src="/balloon-round.png"
      alt="PTB app icon"
      class="ptb-install-icon">

    <div class="ptb-install-text">
      <strong>Pop The Balloon</strong>
      <span>Center Stage</span>
    </div>

    <button id="ptbInstallBtn" class="ptb-install-btn" type="button">Install</button>
  </div>

  <script>
    // Footer year
    (document.getElementById('y') || {}).textContent = new Date().getFullYear();

    // Theme toggle
    const KEY = 'ptb_theme';
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');

    const label = () => btn && btn.querySelector('.theme-toggle__label');
    const icon = () => btn && btn.querySelector('.theme-toggle__icon');
    const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

    function applyTheme(mode, withTransition = false) {
      if (withTransition) {
        root.classList.add('theme-transition');

        requestAnimationFrame(() => {
          root.setAttribute('data-theme', mode);
          setTimeout(() => root.classList.remove('theme-transition'), 650);
        });
      } else {
        root.setAttribute('data-theme', mode);
      }

      const eff = mode === 'auto' ? (prefersDark() ? 'dark' : 'light') : mode;

      if (label()) label().textContent = eff === 'dark' ? 'Dark' : 'Light';
      if (icon()) icon().textContent = eff === 'dark' ? '🌙' : '☀️';

      const logoDark = document.getElementById('logo-dark');
      const logoLight = document.getElementById('logo-light');
      const useDark = eff === 'dark';

      if (logoDark && logoLight) {
        logoDark.style.display = useDark ? 'inline-block' : 'none';
        logoLight.style.display = useDark ? 'none' : 'inline-block';
      }
    }

    function getSaved() {
      return localStorage.getItem(KEY) || 'auto';
    }

    function cycle() {
      const curr = root.getAttribute('data-theme') || 'auto';
      const next = curr === 'auto' ? 'dark' : curr === 'dark' ? 'light' : 'auto';

      localStorage.setItem(KEY, next);
      applyTheme(next, true);
    }

    applyTheme(getSaved());

    if (btn) {
      btn.addEventListener('click', cycle);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem(KEY) || 'auto') === 'auto') {
        applyTheme('auto', true);
      }
    });
  </script>

  <script>
    // Bottom install banner
    (function () {
      const ANDROID_PACKAGE_ID = "com.experimentprojects.centerstage";
      const ANDROID_APP_URL = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE_ID;

      const IOS_APP_URL = "YOUR_IOS_APP_STORE_URL";

      const bar = document.getElementById("ptbInstallBar");
      const closeBtn = document.getElementById("ptbInstallClose");
      const installBtn = document.getElementById("ptbInstallBtn");

      let deferredPrompt = null;

      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(userAgent);
      const isIOS =
        /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      const wasClosed = localStorage.getItem("ptbInstallBarClosed") === "true";

      if (isStandalone || wasClosed || !bar || !closeBtn || !installBtn) {
        return;
      }

      function showInstallBar() {
        bar.hidden = false;
        document.body.classList.add("has-install-bar");
      }

      function hideInstallBar() {
        bar.hidden = true;
        document.body.classList.remove("has-install-bar");
        localStorage.setItem("ptbInstallBarClosed", "true");
      }

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferredPrompt = event;
        showInstallBar();
      });

      if (isAndroid || isIOS) {
        showInstallBar();
      }

      closeBtn.addEventListener("click", hideInstallBar);

      installBtn.addEventListener("click", async function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          hideInstallBar();
          return;
        }

        if (isAndroid) {
          window.location.href = ANDROID_APP_URL;
          return;
        }

        if (isIOS) {
          if (IOS_APP_URL === "YOUR_IOS_APP_STORE_URL") {
            alert("On iPhone: tap the Share button, then tap Add to Home Screen.");
            return;
          }

          window.location.href = IOS_APP_URL;
        }
      });

      window.addEventListener("appinstalled", hideInstallBar);
    })();
  </script>

</body>
</html>
