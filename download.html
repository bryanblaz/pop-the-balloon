<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />

  <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/5X6z2dDT/favicon2.png">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050505" id="themeColorMeta">

  <title>Download • Pop The Balloon — Center Stage</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Download page only */
    .download-page-wrap {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(18px, 4vw, 40px);
      margin: 0 auto;
      box-sizing: border-box;
    }

    .download-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
    }

    .download-balloon {
      width: min(360px, 70vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.28));
      animation: downloadBalloonFloat 4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes downloadBalloonFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-18px);
      }
    }

    .download-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin-top: 4px;
    }

    .store-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      text-decoration: none;
      border-radius: 12px;
    }

    .store-badge {
      width: min(185px, 55vw);
      height: auto;
      display: block;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .store-link:hover .store-badge {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .download-note {
      color: var(--muted);
      font-size: clamp(12px, 2vw, 14px);
      margin: 0;
      max-width: 520px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .download-page-wrap {
        padding-top: 22px;
      }

      .download-balloon {
        width: min(320px, 74vw);
      }

      .store-badge {
        width: min(175px, 55vw);
      }
    }
  </style>
</head>

<body class="legal">

  <!-- Consent Manager snippet -->
  <div id="ptb-consent-container"></div>
  <script>
    fetch('/consent/consent.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('ptb-consent-container').innerHTML = html;

        const script = document.createElement('script');
        script.src = '/consent/consent.js';
        document.body.appendChild(script);
      })
      .catch(() => {
        console.warn('Consent manager failed to load.');
      });
  </script>
  <!-- End Consent Manager snippet -->

  <header class="legal__header">
    <img
      id="brandLogo"
      class="brand-img"
      src="logo-dark.png"
      data-dark-logo="logo-dark.png"
      data-light-logo="logo-light.png"
      alt="Pop The Balloon Center Stage logo"
    />

    <nav class="legal__nav" aria-label="Legal links">
      <a href="home.html" class="legal__nav-link">Home</a>
      <a href="index.html" class="legal__nav-link">Terms of Service</a>
      <a href="privacy.html" class="legal__nav-link">Privacy Policy</a>
      <a href="safety.html" class="legal__nav-link">User Safety &amp; Reporting</a>
      <a href="download.html" class="legal__nav-link is-active" aria-current="page">Download</a>
      <a href="contact.html" class="legal__nav-link">Contact Us</a>
      <a href="faq.html" class="legal__nav-link">FAQ</a>
      <a href="child-safety.html" class="legal__nav-link">CSAE</a>
    </nav>

    <div class="theme-toggle">
      <button id="themeBtn" class="theme-toggle__btn" type="button">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark</span>
      </button>
    </div>
  </header>

  <main class="download-page-wrap">
    <section class="download-card" aria-label="Download Pop The Balloon">

      <img
        src="balloon-round.png"
        alt="Pop The Balloon red balloon"
        class="download-balloon"
      />

      <div class="download-buttons">

        <a
          class="store-link"
          href="https://apps.apple.com/app/ptb-center-stage/id6756091119"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Download on the App Store">
          <img
            id="iosBadge"
            src="logo-ios-light.svg"
            data-dark-badge="logo-ios-light.svg"
            data-light-badge="logo-ios-dark.svg"
            alt="Download on the App Store"
            class="store-badge"
          />
        </a>

        <a
          class="store-link"
          href="https://play.google.com/store/apps/details?id=com.experimentprojects.centerstage"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Get it on Google Play">
          <img
            id="androidBadge"
            src="logo-android-light.svg"
            data-dark-badge="logo-android-light.svg"
            data-light-badge="logo-android-dark.svg"
            alt="Get it on Google Play"
            class="store-badge"
          />
        </a>

      </div>

      <p class="download-note">
        Available for iOS and Android.
      </p>
    </section>
  </main>

  <footer class="legal__footer">
    <p>© <span id="y"></span> PTB Center Stage</p>
  </footer>

  <script>
    // Footer year
    const yearEl = document.getElementById('y');

    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    // Theme toggle
    const KEY = 'ptb_theme';
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const themeColorMeta = document.getElementById('themeColorMeta');

    const label = () => btn && btn.querySelector('.theme-toggle__label');
    const icon = () => btn && btn.querySelector('.theme-toggle__icon');

    function getStoredTheme() {
      try {
        return localStorage.getItem(KEY);
      } catch (error) {
        return null;
      }
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem(KEY, theme);
      } catch (error) {
        // Ignore storage errors in restricted in-app browsers.
      }
    }

    function getSavedTheme() {
      const savedTheme = getStoredTheme();

      // Fix old saved values from previous code.
      // Old value "auto" can cause LinkedIn/mobile browsers
      // to show the wrong logo depending on the phone theme.
      if (savedTheme !== 'dark' && savedTheme !== 'light') {
        setStoredTheme('dark');
        return 'dark';
      }

      return savedTheme;
    }

    function updateLogo(mode) {
      const logo = document.getElementById('brandLogo');

      if (!logo) {
        return;
      }

      const darkLogo = logo.dataset.darkLogo || 'logo-dark.png';
      const lightLogo = logo.dataset.lightLogo || 'logo-light.png';

      logo.src = mode === 'dark' ? darkLogo : lightLogo;
    }

    function updateStoreBadges(mode) {
      const iosBadge = document.getElementById('iosBadge');
      const androidBadge = document.getElementById('androidBadge');

      if (iosBadge) {
        iosBadge.src = mode === 'dark'
          ? iosBadge.dataset.darkBadge
          : iosBadge.dataset.lightBadge;
      }

      if (androidBadge) {
        androidBadge.src = mode === 'dark'
          ? androidBadge.dataset.darkBadge
          : androidBadge.dataset.lightBadge;
      }
    }

    function updateThemeButton(mode) {
      if (label()) {
        label().textContent = mode === 'dark' ? 'Dark' : 'Light';
      }

      if (icon()) {
        icon().textContent = mode === 'dark' ? '🌙' : '☀️';
      }
    }

    function updateThemeColor(mode) {
      if (!themeColorMeta) {
        return;
      }

      themeColorMeta.setAttribute('content', mode === 'dark' ? '#050505' : '#ffffff');
    }

    function applyTheme(mode, withTransition = false) {
      const cleanMode = mode === 'light' ? 'light' : 'dark';

      if (withTransition) {
        root.classList.add('theme-transition');

        requestAnimationFrame(() => {
          root.setAttribute('data-theme', cleanMode);
          updateLogo(cleanMode);
          updateStoreBadges(cleanMode);
          updateThemeButton(cleanMode);
          updateThemeColor(cleanMode);

          setTimeout(() => {
            root.classList.remove('theme-transition');
          }, 650);
        });

        return;
      }

      root.setAttribute('data-theme', cleanMode);
      updateLogo(cleanMode);
      updateStoreBadges(cleanMode);
      updateThemeButton(cleanMode);
      updateThemeColor(cleanMode);
    }

    function cycleTheme() {
      const currentTheme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      setStoredTheme(nextTheme);
      applyTheme(nextTheme, true);
    }

    applyTheme(getSavedTheme());

    if (btn) {
      btn.addEventListener('click', cycleTheme);
    }
  </script>

</body>
</html>
