<!-- Pop The Balloon • Consent Manager (HTML include) -->
<link rel="stylesheet" href="/consent/consent.css">

<div id="ptb-consent-backdrop"></div>

<div id="ptb-consent" role="dialog" aria-labelledby="ptb-consent-title" aria-modal="true" hidden>
  <div class="inner">
    <h4 id="ptb-consent-title">Cookies & Tracking</h4>
    <p>We use cookies and similar tech to run the site, measure usage, fix bugs, and—if you allow—personalize. You can change your choices any time.</p>
    <p><a class="link" href="/cookies.html" target="_blank" rel="noopener">Learn more</a></p>
  </div>

  <div class="prefs" id="ptb-prefs">
    <div class="pref">
      <input type="checkbox" id="ptb-strict" disabled checked>
      <label for="ptb-strict"><b>Strictly necessary</b> (required)</label>
    </div>
    <div class="pref">
      <input type="checkbox" id="ptb-analytics">
      <label for="ptb-analytics"><b>Analytics & performance</b></label>
    </div>
    <div class="pref">
      <input type="checkbox" id="ptb-crash">
      <label for="ptb-crash"><b>Crash diagnostics</b></label>
    </div>
    <div class="pref">
      <input type="checkbox" id="ptb-ads">
      <label for="ptb-ads"><b>Personalization & ads</b></label>
    </div>
  </div>

  <div class="row">
    <button class="btn ghost" id="ptb-customize">Customize</button>
    <button class="btn" id="ptb-reject">Reject all</button>
    <button class="btn primary" id="ptb-accept">Accept all</button>
  </div>
</div>

<button id="ptb-manage-consent" class="btn ghost" type="button">Cookies</button>
